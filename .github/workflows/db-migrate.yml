name: Apply database migrations

# Applies new files in supabase/migrations to the hosted Supabase project
# whenever they land on develop. Needs two repository secrets:
#   SUPABASE_ACCESS_TOKEN  – personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – the database password set when the project was created
on:
  push:
    branches: [develop]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cemnqswodgaqmctqbogo
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show pending migrations
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
