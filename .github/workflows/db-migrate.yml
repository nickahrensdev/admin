name: Apply database migrations

# Applies new files in supabase/migrations to the hosted Supabase project
# whenever they land on develop. Needs two repository secrets:
#   SUPABASE_ACCESS_TOKEN  – personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   – the database password set when the project was created
#
# It connects through Supabase's connection pooler (IPv4), because GitHub's
# runners can't reach the database's direct IPv6 address. If a run fails, the
# error is posted as a comment on the commit so it can be read without
# opening the run logs.
on:
  # Run by the CI workflow after all tests pass (see ci.yml); can also be run by hand.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: write   # to comment on the commit when a run fails

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: cemnqswodgaqmctqbogo
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD (Settings → Secrets and variables → Actions)." | tee -a "$RUNNER_TEMP/out.log"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Find database connection (pooler)
        run: |
          set -o pipefail
          resp=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" 2>&1) \
            || { echo "Could not read pooler settings from the Supabase API: $resp" | tee -a "$RUNNER_TEMP/out.log"; exit 1; }
          host=$(echo "$resp" | jq -r '(map(select(.database_type == "PRIMARY")) + .)[0].db_host')
          user=$(echo "$resp" | jq -r '(map(select(.database_type == "PRIMARY")) + .)[0].db_user')
          if [ -z "$host" ] || [ "$host" = "null" ]; then
            echo "Unexpected pooler response: $(echo "$resp" | head -c 500)" | tee -a "$RUNNER_TEMP/out.log"; exit 1
          fi
          echo "Using pooler host $host (session mode, port 5432) as $user" | tee -a "$RUNNER_TEMP/out.log"
          pw=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$pw"
          echo "DB_URL=postgresql://$user:$pw@$host:5432/postgres" >> "$GITHUB_ENV"

      - name: Show migrations
        run: |
          set -o pipefail
          supabase migration list --remote="$DB_URL" 2>&1 | tee -a "$RUNNER_TEMP/out.log"

      - name: Apply migrations
        run: |
          set -o pipefail
          supabase db push --remote="$DB_URL" --include-all --yes 2>&1 | tee -a "$RUNNER_TEMP/out.log"

      - name: Report failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - > "$RUNNER_TEMP/body.md" <<'PY'
          import os, urllib.parse
          try:
              log = open(os.path.join(os.environ["RUNNER_TEMP"], "out.log")).read().splitlines()[-40:]
          except FileNotFoundError:
              log = ["(no output captured)"]
          text = "\n".join(log)
          for secret in (os.environ.get("SUPABASE_DB_PASSWORD", ""), urllib.parse.quote(os.environ.get("SUPABASE_DB_PASSWORD", ""), safe="")):
              if secret:
                  text = text.replace(secret, "***")
          run = f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}'
          print(f"**Apply database migrations failed** ([run]({run}))\n\n```\n{text}\n```")
          PY
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@"$RUNNER_TEMP/body.md" >/dev/null
