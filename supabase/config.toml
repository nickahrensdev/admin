# Supabase CLI settings. The hosted project is linked in CI with
# `supabase link --project-ref cemnqswodgaqmctqbogo`.
project_id = "the-yard"

[db]
major_version = 17

# Called by signed-out users, so it must not require a JWT.
[functions.sign-in]
verify_jwt = false

# These check the caller themselves (Supabase Auth / Stripe signature).
[functions.create-checkout]
verify_jwt = false

[functions.cancel-booking]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.create-membership-checkout]
verify_jwt = false

[functions.billing-portal]
verify_jwt = false

# Called every minute by pg_cron; it only sends emails that are already queued.
[functions.send-emails]
verify_jwt = false

[functions.change-membership]
verify_jwt = false

[functions.reschedule-booking]
verify_jwt = false

[functions.apply-tier-price]
verify_jwt = false
